# ============================================================================
# MBG Smart Logistics — Docker Compose (Monorepo Orchestration)
# ============================================================================
# Services:
#   1. mysql        — MySQL 8.0 (primary database)
#   2. backend      — Golang API (Gin + GORM + WebSocket)
#   3. osrm         — OSRM Backend (East Java / Malang routing engine)
#   4. ai-services  — Python FastAPI (PaddleOCR + PyTorch A2C) [NVIDIA GPU]
#
# Target Hardware: Acer Nitro V15, RTX 5050 (8GB VRAM), 16GB RAM
#
# Usage:
#   First time:  Run scripts/setup_osrm.ps1 to download & prepare map data
#   Start:       docker compose up -d
#   Stop:        docker compose down
#   Reset DB:    docker compose down -v && docker compose up -d
#   GPU check:   docker compose run --rm ai-services python3 -c "import torch; print(torch.cuda.is_available())"
# ============================================================================

services:
  # ──────────────────────────────────────────────────────────────────────
  # Golang Backend API — Core REST + WebSocket
  # ──────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend-golang
      dockerfile: Dockerfile
    container_name: mbg_backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: mbg_admin
      DB_PASSWORD: mbg_secure_2026
      DB_NAME: mbg_smart_logistics
      OSRM_BASE_URL: http://osrm:5000
      AI_SERVICE_URL: http://ai-services:9000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      SERVER_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-mbg-smart-logistics-jwt-secret-change-in-production}
      SHELF_LIFE_BUFFER_MINUTES: "30"
      DEFAULT_SERVICE_TIME_SECONDS: "300"
      MAX_IMPROVEMENT_ITERATIONS: "1000"
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # OSRM Backend — Local Routing Engine (East Java / Malang)
  # ──────────────────────────────────────────────────────────────────────
  # PREREQUISITE: Run scripts/setup_osrm.ps1 first to download & process
  # the East Java OSM map data into OSRM format.
  # ──────────────────────────────────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend:latest
    container_name: mbg_osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data:ro
    command: >
      osrm-routed
        --algorithm mld
        --max-table-size 200
        --port 5000
        /data/east-java-latest.osrm
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # AI Microservice — PaddleOCR + PyTorch A2C (NVIDIA GPU)
  # ──────────────────────────────────────────────────────────────────────
  # CRITICAL: This service requires the NVIDIA Container Toolkit
  # installed on the host machine for GPU passthrough.
  #
  # Install: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
  # Verify:  docker run --rm --gpus all nvidia/cuda:12.6.3-base-ubuntu22.04 nvidia-smi
  # ──────────────────────────────────────────────────────────────────────
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: mbg_ai
    ports:
      - "9000:9000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      CUDA_VISIBLE_DEVICES: "0"
    # ── CRITICAL: NVIDIA GPU Passthrough ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; r = httpx.get('http://localhost:9000/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    restart: unless-stopped

